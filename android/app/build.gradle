plugins {
    id 'com.android.application'
}

android {
    namespace 'org.example.remoteeink'
    compileSdk 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'org.example.remoteeink'
        minSdk 17
        targetSdk 28
        versionCode 10
        versionName '0.4.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
