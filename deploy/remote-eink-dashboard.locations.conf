location = / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}

location = /calendar-weather.json {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}

location = /health {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}

location = /.dashboard.env { return 404; }
location ^~ /.dashboard-data/ { return 404; }
location = /.dashboard-font.ttf { return 404; }
location = /index.php { return 404; }

location ^~ /frame/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    fastcgi_read_timeout 20s;
    access_log off;
}

location ^~ /viewer/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}

location ^~ /widget/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}

location = /scriptable/dashboard-widget.js {
    alias /var/www/remote-eink-dashboard/scriptable/dashboard-widget.js;
    default_type text/plain;
    charset utf-8;
    access_log off;
}

location = /install {
    alias /var/www/remote-eink-dashboard/scriptable/calendar-weather-install.html;
    default_type text/html;
    charset utf-8;
    access_log off;
}

location = /v1/ingest/quota {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}

location ~ ^/v1/ingest/server-status/[a-z0-9_-]+$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/tmp/php-cgi-74.sock;
    access_log off;
}
